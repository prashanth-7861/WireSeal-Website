    <style>
        .changelog-list {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .loading-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        
        .release-item {
            padding: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            margin-bottom: 1rem;
            transition: var(--transition);
        }
        
        .release-item:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-sm);
        }
        
        .release-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .release-tag {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .release-date {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        
        .release-body {
            font-size: 0.9375rem;
            line-height: 1.7;
        }
        
        .release-body h4 {
            font-size: 0.8125rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin: 1rem 0 0.5rem;
        }
        
        .release-body ul {
            margin: 0;
            padding-left: 1.25rem;
            color: var(--text-secondary);
        }
        
        .release-body li {
            margin-bottom: 0.375rem;
        }
        
        .release-body code {
            background: var(--surface-elevated);
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-size: 0.8125rem;
            color: var(--primary);
        }
        
        .release-link {
            display: inline-block;
            margin-top: 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--primary);
        }
        
        .release-link:hover {
            color: var(--primary-dark);
        }
    </style>

    <script>
        // Escape HTML so release notes from the GitHub API cannot inject
        // markup / event handlers (e.g. <img onerror=...>) into the page.
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        async function fetchAllReleases() {
            const container = document.getElementById('changelog-timeline');
            try {
                const response = await fetch('https://api.github.com/repos/prashanth-7861/WireSeal/releases?per_page=15');
                const releases = await response.json();
                
                let html = '';
                for (const release of releases) {
                    const pubDate = new Date(release.published_at);
                    const dateStr = pubDate.toLocaleDateString('en-US', { 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric' 
                    });
                    
                    let bodyHtml = '';
                    if (release.body) {
                        const lines = release.body.split('\n');
                        let inList = false;
                        for (const line of lines) {
                            if (line.startsWith('### ')) {
                                if (inList) { bodyHtml += '</ul>'; inList = false; }
                                bodyHtml += `<h4>${esc(line.replace('### ', ''))}</h4>`;
                            } else if (line.startsWith('- ')) {
                                if (!inList) { bodyHtml += '<ul>'; inList = true; }
                                // Escape first, THEN turn `code` spans into <code> tags
                                // so only our own markup is HTML, never the note content.
                                const li = esc(line.replace('- ', '')).replace(/`([^`]+)`/g, '<code>$1</code>');
                                bodyHtml += `<li>${li}</li>`;
                            }
                        }
                        if (inList) bodyHtml += '</ul>';
                    }
                    
                    html += `
                        <div class="release-item">
                            <div class="release-header">
                                <span class="release-tag">${esc(release.tag_name)}</span>
                                <span class="release-date">${esc(dateStr)}</span>
                            </div>
                            <div class="release-body">${bodyHtml}</div>
                            <a href="${esc(release.html_url)}" class="release-link" target="_blank" rel="noopener noreferrer">
                                View release notes →
                            </a>
                        </div>
                    `;
                }
                
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = `
                    <div class="release-item">
                        <div class="release-header">
                            <span class="release-tag">v1.0.0</span>
                            <span class="release-date">May 7, 2026</span>
                        </div>
                        <div class="release-body">
                            <h4>Fixed</h4>
                            <ul>
                                <li>SSH TOFU host key capture — replaced broken approach with proper <code>_TofuCapturingClient</code> SSHClient subclass</li>
                                <li>Fingerprint and key export now resolve correctly instead of showing <code>&lt;unknown fingerprint&gt;</code></li>
                            </ul>
                        </div>
                    </div>
                `;
            }
        }
        
        document.addEventListener('DOMContentLoaded', fetchAllReleases);
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme toggle
            const themeToggle = document.querySelector('.theme-toggle');
            if (themeToggle) {
                const htmlElement = document.documentElement;
                
                // Check for saved theme preference or use system preference
                const savedTheme = localStorage.getItem('theme');
                const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                
                if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                    htmlElement.setAttribute('data-theme', 'dark');
                    updateThemeIcon(true);
                }
                
                themeToggle.addEventListener('click', () => {
                    const isDark = htmlElement.getAttribute('data-theme') === 'dark';
                    if (isDark) {
                        htmlElement.removeAttribute('data-theme');
                        localStorage.setItem('theme', 'light');
                        updateThemeIcon(false);
                    } else {
                        htmlElement.setAttribute('data-theme', 'dark');
                        localStorage.setItem('theme', 'dark');
                        updateThemeIcon(true);
                    }
                });
                
                function updateThemeIcon(isDark) {
                    const sunIcon = themeToggle.querySelector('.icon-sun');
                    const moonIcon = themeToggle.querySelector('.icon-moon');
                    if (sunIcon && moonIcon) {
                        if (isDark) {
                            sunIcon.style.display = 'none';
                            moonIcon.style.display = 'block';
                        } else {
                            sunIcon.style.display = 'block';
                            moonIcon.style.display = 'none';
                        }
                    }
                }
            }
        });
    </script>
    <script src="premium.js" defer></script>
</body>
</html>
